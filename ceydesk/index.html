qlines(code, feeOverride, opts) {
  const s = this.svc(code); const o = opts || {}; const fee = feeOverride != null ? feeOverride : this.fee(code); const L = [];
  L.push({ l: 'Professional fee: ' + s.code + ' ' + s.name + (o.feeNote ? ' (' + o.feeNote + ')' : ''), ty: 'fee', a: fee });
  if (o.included) L.push({ l: 'Included entitlement: ' + o.included, ty: 'disc', a: -fee });
  const ex = o.express && !o.included ? Math.round(fee * this.plans().express) : 0; if (ex) L.push({ l: 'Express handling: target time halved (+' + Math.round(this.plans().express * 100) + '%)', ty: 'fee', a: ex });
  const pd = o.pkg && !o.included ? Math.round(fee * o.pkg.rate) : 0; if (pd) L.push({ l: 'Package saving: ' + o.pkg.name + ' (' + Math.round(o.pkg.rate * 100) + '%)', ty: 'disc', a: -pd });
  (s.gov || []).forEach((g) => L.push({ l: g[0], ty: 'gov', a: g[1], est: true }));
  (s.bundle || []).forEach((b) => L.push({ l: 'Included, not billed: ' + b[0] + ' (catalogue value ' + this.fmt(b[1]) + ')', ty: 'incl', a: 0 }));
  const taxable = o.included ? 0 : fee + ex - pd;
  if (taxable > 0) L.push({ l: 'Applicable taxes on professional fee (demo rate 18%)', ty: 'tax', a: Math.round(taxable * 0.18) });
  return L;
